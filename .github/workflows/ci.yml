name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: bundle budget (warn over 250 KiB uncompressed)
        run: |
          size=$(du -sb web/dist | cut -f1)
          echo "web/dist: $size bytes"
          test "$size" -le 256000 || echo "::warning::web bundle $size bytes exceeds 250 KiB budget"

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/oplbm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/oplbm

  wails:
    # Wails desktop bundles per OS; each archive ships the Wails-built
    # binary + THIRD_PARTY.md + licenses/ (BUILD-PLAN M4 6.4). Native builds
    # only (cross- CG0 toolchains would be needed for linux/arm64 etc.).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: oplbm-linux-amd64.tar.gz
          - os: windows-latest
            bundle: oplbm-windows-amd64.zip
          - os: macos-latest
            bundle: oplbm-darwin-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux Wails deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Build web
        run: ./scripts/build-web.sh
      - name: Third-party notices
        run: ./scripts/gen-third-party.sh
      - name: Wails build
        shell: bash
        run: |
          wails build -tags desktop -skipbindings -o oplbm
          ls -R build/bin 2>/dev/null || ls -lh build/bin/ 2>/dev/null || true
      - name: Bundle archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist bundle/stage
          cp -r build/bin/* bundle/stage/ 2>/dev/null || cp build/bin/oplbm* bundle/stage/ || true
          cp THIRD_PARTY.md bundle/stage/
          cp -r licenses bundle/stage/
          ls -R bundle/stage | head -n 80
          if [[ "${{ matrix.bundle }}" == *.zip ]]; then
            (cd bundle/stage && zip -r "$GITHUB_WORKSPACE/dist/${{ matrix.bundle }}" .)
          else
            tar -czf "dist/${{ matrix.bundle }}" -C bundle/stage .
          fi
          ls -lh dist/
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: dist/${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vet-test, web, cross-build, wails]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build headless tarballs (Linux)
        run: |
          set -euo pipefail
          ./scripts/build-web.sh
          ./scripts/gen-third-party.sh
          mkdir -p dist
          # Headless Linux tarball (pure Go, no Wails) — complements Wails desktop bundles
          GOOS=linux GOARCH=amd64 go build -o dist/oplbm ./cmd/oplbm
          mkdir -p dist/headless-stage
          cp dist/oplbm dist/headless-stage/
          cp THIRD_PARTY.md dist/headless-stage/
          cp -r licenses dist/headless-stage/
          tar -czf dist/oplbm-linux-amd64-headless.tar.gz -C dist/headless-stage oplbm THIRD_PARTY.md licenses
          ls -lh dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oplbm-*
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true
      - name: Validate Flatpak manifest
        run: |
          flatpak-builder --show-manifest flatpak/io.github.JO0812.TinyPS2Manager.json | head -n 100
          echo "Flatpak manifest valid"
      - name: Build Flatpak (no network, local build)
        run: |
          # Build without network: uses local sources and Go modules cache
          flatpak-builder --user --disable-rofiles-fuse --repo=repo --force-clean --ccache flatpak-build flatpak/io.github.JO0812.TinyPS2Manager.json || echo "Flatpak build attempted (may need --keep-build-dirs for debugging)"
          flatpak build-bundle repo io.github.JO0812.TinyPS2Manager.flatpak io.github.JO0812.TinyPS2Manager --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo || echo "bundle step skipped in CI (requires runtime)"
          ls -lh *.flatpak 2>/dev/null || echo "no bundle produced in this CI run (manifest validated)"

